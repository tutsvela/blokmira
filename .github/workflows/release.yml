name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches plugin.json
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build release files
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=blokmira/ -o "dist/blokmira-${GITHUB_REF_NAME#v}.zip" "${GITHUB_REF_NAME}"
          (cd skills && zip -qr ../dist/blokmira.skill blokmira)

      - name: Take release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > dist/notes.md
          printf '\n## Install\n\n- **Claude Code:** `/plugin marketplace add tutsvela/blokmira`, then `/plugin install blokmira@blokmira`\n- **Claude.ai or Claude Desktop:** upload `blokmira.skill` under Settings › Capabilities › Skills\n- **Other agents:** copy `skills/blokmira/` from the source zip into your skills folder\n\nFull guide: [docs/installation.md](https://github.com/%s/blob/%s/docs/installation.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> dist/notes.md
          test -s dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "dist/blokmira.skill" "dist/blokmira-${GITHUB_REF_NAME#v}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "dist/blokmira.skill" "dist/blokmira-${GITHUB_REF_NAME#v}.zip" \
              --title "Blokmira ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --latest
          fi
